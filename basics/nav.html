<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <style>
      *{
      margin:0;
      padding:0;
      box-sizing: border-box;
    }
    html,body{
      height: 100%;
      width: 100%;
    }
    nav{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 30px;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    .nav-1{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-weight: 100;
    }
    .nav-2{
      display: flex;
      align-items: center;
      justify-content: center;
      gap:15px;
    }
    .nav-1 h6{
      font-size: 20px;
      font-weight: 100;
      color: green;
      width: 50px;

    }

    .nav-1 img{
      height: 50px;
      width: 50px;
      border-radius: 50%;

    }
    .nav-2 h4{
      font-size: 17px;
      font-weight: 100;
    }
    .nav-2 h5{
        font-size: 20px;
        display: none;
    }

    @media (max-width:600px){
      nav{
        padding: 15px 15px;
      }
    .nav-2 h4{
      display: none;
    }
    .nav-2 h5{
      display: inline;
    }
  }
  </style>

  <body>
    <nav>
      <div class="nav-1">
        <img
          src="https://images.unsplash.com/photo-1780163930838-1502715c3bc1?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNDZ8fHxlbnwwfHx8fHw%3D"
          alt=""
        />
        <h6>Nature themed</h6>
      </div>
      <div class="nav-2">
        <h4>Home</h4>
        <h4>NatureNest</h4>
        <h4>WildRoots</h4>
        <h4>About us</h4>
        <h5><i class="ri-menu-line"></i></h5>
      </div>
    </nav>
  </body>
</html>
