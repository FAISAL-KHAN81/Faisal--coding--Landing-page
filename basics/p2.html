<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background-color:#7ADfff
  }
   .container{
    max-width:800px;
    height:500px;
    margin:70px auto;
    padding:8px 8px;
    
  }
  .box{
    width:100%;
    height: 100%;
    background-color:white;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:10px;
    
  }
  @media screen and (width > 800px){
 grid{
    grid-template-columns:1fr 1fr 1fr 1fr;
    
  }
  .container{
    margin:50px auto;
  }
  }
  
    @media screen and (width <250px){
    .grid{
    grid-template-columns:repeat(2,1fr); 
  }
   .container{
    margin:30px auto;
  }
  }
</style>
<body>
  <section class="container grid">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
     <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </section>

</body>
</html>
